<body>

  <header class="topo">

      <a class="marca" href="index.html">k4pu <span>33</span></a>

  <nav class="nav-principal menu-central">

  <section class="secao secao-terminal">
    <div class="secao-titulo">
      <h2>terminal</h2>
      <span class="contagem">type "help"</span>
    </div>

    <div class="terminal-janela" id="terminal-janela">
      <div class="terminal-barra">
        <span class="terminal-titulo">kapu@33: ~</span>
      </div>

      <div class="terminal-corpo" id="terminal-corpo" aria-live="polite"></div>

      <div class="terminal-linha-atual">
        <span class="terminal-prompt">kapu@33:~$</span>
        <span class="terminal-visivel">
          <span id="terminal-digitado" class="terminal-digitado"></span><span class="terminal-cursor" aria-hidden="true"></span>
        </span>
        <input
          type="text"
          id="terminal-input"
          class="terminal-input-real"
          autocomplete="off"
          autocapitalize="off"
          autocorrect="off"
          spellcheck="false"
          aria-label="comando do terminal">
      </div>
    </div>
  </section>

  <footer class="rodape">
    <div class="rodape-conteudo">
      <span>k4pu</span>
      <span class="discord">discord: kapuxn</span>
